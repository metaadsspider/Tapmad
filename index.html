<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.plyr{width:100%;height:100%;--plyr-color-main:#fff}
.plyr__controls{justify-content:space-between!important}
#status{position:absolute;top:10px;left:10px;color:#fff;background:#0009;padding:6px 9px;
font:13px system-ui;border-radius:5px;z-index:5;display:none}
</style>
</head>
<body>
<div id="wrap">
<video id="video" playsinline autoplay muted></video>
<div id="status">Reconnecting to live stream…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<script>
/* ── Hardened player ──────────────────────────────────────────────────
   The real m3u8 URL is NEVER present in this page. The player asks the
   same-origin relay (server.js) for a short-lived, HMAC-signed, IP-bound
   session and every playlist/segment request goes through opaque
   /live/<token>/... paths. View-source, extensions and scrapers can only
   ever see expiring proxy URLs — never the upstream host.                */

const video = document.getElementById('video'), status = document.getElementById('status');

/* Same-origin by default (server.js serves this page). If you host the page
   elsewhere — e.g. on https://crickontime1.vercel.app — point this at the
   relay: SESSION_ENDPOINT = 'https://your-relay-host.com/api/session', and
   add that origin to ALLOWED_ORIGINS in the relay's .env.
   NOTE: the relay must be on HTTPS — an https page cannot call http. */
const SESSION_ENDPOINT = '/api/session';
const SEC_HEADERS = { 'X-Player': 'hls-secure' };

const player = new Plyr(video, {
  autoplay: true, muted: true,
  controls: ['play', 'mute', 'volume', 'fullscreen'],
  settings: [], clickToPlay: false, hideControls: true
});

/* Loader that masks any redirect/CDN URLs hls.js might pick up from
   responses, so even intermediate hops stay out of JS-inspectable state. */
class SecureLoader extends Hls.DefaultConfig.loader {
  load(context, config, callbacks) {
    const orig = callbacks.onSuccess;
    if (orig) callbacks.onSuccess = function (response, stats, ctx, net) {
      try { if (response && response.url) response.url = ctx.url; } catch (e) {}
      orig(response, stats, ctx, net);
    };
    super.load(context, config, callbacks);
  }
}

let hls = null, netFails = 0, lastTime = -1, stuckChecks = 0, reconnecting = false;

async function getSessionUrl() {
  const r = await fetch(SESSION_ENDPOINT, { method: 'POST', headers: SEC_HEADERS });
  if (!r.ok) throw new Error('session ' + r.status);
  const d = await r.json();
  /* Resolve the returned /live/<token>/... path against the RELAY origin —
     works both same-origin and when the page is hosted on another domain
     (e.g. Vercel) pointing at a remote relay. */
  return new URL(d.url, new URL(SESSION_ENDPOINT, location.href)).href;
}

function makeHls() {
  return new Hls({
    liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 8,
    maxLiveSyncPlaybackRate: 1.5, lowLatencyMode: false, backBufferLength: 30,
    maxBufferLength: 20, maxMaxBufferLength: 30,
    manifestLoadingTimeOut: 20000, levelLoadingTimeOut: 20000,
    fragLoadingTimeOut: 30000, fragLoadingMaxRetry: 6, fragLoadingRetryDelay: 1000,
    levelLoadingMaxRetry: 6, levelLoadingRetryDelay: 1000,
    loader: SecureLoader,
    xhrSetup: (xhr) => { try { xhr.setRequestHeader('X-Player', 'hls-secure'); } catch (e) {} }
  });
}

async function connect() {
  if (hls) { try { hls.destroy() } catch (e) {} hls = null; }
  reconnecting = false; stuckChecks = 0; netFails = 0;
  status.textContent = 'Reconnecting to live stream…'; status.style.display = 'block';
  let url;
  try { url = await getSessionUrl(); }
  catch (e) { status.textContent = 'Stream unavailable — retrying…'; setTimeout(connect, 4000); return; }
  status.style.display = 'none';
  hls = makeHls(); hls.loadSource(url); hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) return; status.style.display = 'block';
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
      /* token may have expired or viewer IP changed → fresh session after a few tries */
      if (++netFails >= 3) { netFails = 0; setTimeout(connect, 1500); }
      else hls.startLoad();
    }
    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    else setTimeout(connect, 2500);
  });
}

video.addEventListener('playing', () => { status.style.display = 'none'; stuckChecks = 0; netFails = 0; });
video.addEventListener('waiting', () => { status.textContent = 'Buffering…'; status.style.display = 'block'; });
video.addEventListener('stalled', () => { status.textContent = 'Stream stalled — reconnecting…'; status.style.display = 'block'; });

setInterval(() => {
  if (video.paused || video.readyState < 2) return;
  if (video.currentTime === lastTime) stuckChecks++; else stuckChecks = 0;
  lastTime = video.currentTime;
  if (stuckChecks >= 4 && !reconnecting) {
    reconnecting = true; status.textContent = 'Reconnecting…'; status.style.display = 'block';
    setTimeout(() => reconnecting = false, 10000);
    connect(); /* full reconnect with a fresh signed session */
  }
}, 5000);

/* keep the signed session warm while watching (sessions also slide server-side on every request) */
setInterval(() => { fetch(SESSION_ENDPOINT, { method: 'POST', headers: SEC_HEADERS }).catch(() => {}); }, 4 * 60 * 1000);

/* native HLS fallback (iPhone / iPad Safari) — still only ever sees proxy URLs */
if (Hls.isSupported()) connect();
else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  getSessionUrl().then(url => { video.src = url; video.play().catch(() => {}); })
                 .catch(() => setTimeout(() => location.reload(), 4000));
} else { status.textContent = 'Browser not supported'; status.style.display = 'block'; }

/* light client-side deterrents — the real protection lives in the relay */
document.getElementById('wrap').addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
