<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream</title>
<style>
  html,body{margin:0;height:100%;background:#000}
  video{width:100%;height:100%}
</style>
</head>
<body>
<video id="videoEl" controls autoplay muted playsinline></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const videoEl = document.getElementById('videoEl');
const url = 'https://edge14.xmediaget.com/hls-live/20915984/1/mediaplaylist.m3u8?s=d55fbb41eaa7f9e8e118094ad4b5e310b3e50d68e5adbe7957576eeb541c9e5b&t=1794137429934&ai=3&av=1025&ui=1153549459';

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(url);
  hls.attachMedia(videoEl);
  hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play());
  hls.on(Hls.Events.ERROR, (_, d) => {
    console.log(d.type, d.details, d.response && d.response.code);
    if (!d.fatal) return;
    if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
    else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
  });
} else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
  videoEl.src = url;
  videoEl.play();
}
</script>
</body>
</html>
