<style>

body{

.player-container{

/* Embed button */
.embed-btn{
    position:absolute;

}
.embed-btn:hover{

    border-color:#fff;
}
.embed-btn svg{
    width:14px;
    height:14px;
    fill:currentColor;
}

/* Modal */
.embed-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);

    align-items:center;
    justify-content:center;

.embed-modal{

.embed-modal-header{

.embed-modal-header h3{

}

.embed-close{

    color:#aaa;
    font-size:22px;
    cursor:pointer;
    line-height:1;
    padding:0 4px;
}
.embed-close:hover{
    color:#fff;
}

.embed-modal-body{
    padding:20px;
}

.embed-row{
    display:flex;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
}
.embed-field{

.embed-field label{

    margin-bottom:6px;

.embed-field input{

    border-radius:6px;
    font-size:13px;
    font-family:Arial,sans-serif;
}
.embed-field input:focus{
    outline:none;
    border-color:#fff;
}

.embed-code-wrap{
    position:relative;
    background:#000;
    border:1px solid #444;
    border-radius:6px;
    margin-bottom:16px;
}
.embed-code-wrap textarea{
    width:100%;
    min-height:120px;
    background:transparent;
    border:none;
    color:#d4f7d4;
    padding:12px;
    font-family:'Courier New',monospace;
    font-size:12px;
    resize:vertical;
    line-height:1.5;
    white-space:pre;
    overflow:auto;
}
.embed-code-wrap textarea:focus{
    outline:none;
}

.embed-actions{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}
.embed-copy-btn{
    background:#fff;
    color:#000;
    border:none;
    padding:9px 18px;
    font-size:13px;
    font-weight:600;
    border-radius:6px;
    cursor:pointer;

}
.embed-copy-btn:hover{

}
.embed-copy-btn.copied{
    background:#2ecc71;
    color:#fff;
}
.embed-hint{
    font-size:12px;
    color:#888;
}
.embed-preview-link{

    color:#4dabf7;

}
.embed-preview-link:hover{

}

/* ---------- Embed frame option ---------- */
(function () {
    const embedBtn      = document.getElementById('embedBtn');
    const embedModal    = document.getElementById('embedModal');
    const embedClose    = document.getElementById('embedClose');
    const embedWidth    = document.getElementById('embedWidth');
    const embedHeight   = document.getElementById('embedHeight');
    const embedCode     = document.getElementById('embedCode');
    const embedCopy     = document.getElementById('embedCopy');
    const embedHint     = document.getElementById('embedHint');
    const embedPreview  = document.getElementById('embedPreview');

    // The page URL that the iframe should load (this very page).
    // Falls back gracefully if location.href isn't available.
    function selfUrl() {
        try {
            return window.location.href.split('#')[0];
        } catch (e) {
            return '';
        }
    }

    function escAttr(s) {
        return String(s).replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
    }

    function buildCode() {
        const url = selfUrl();
        const w   = (embedWidth.value.trim() || '640');
        const h   = (embedHeight.value.trim() || '360');
        const src = url;

        embedCode.value =
            '<iframe\n' +
            '  src="' + escAttr(src) + '"\n' +
            '  width="' + escAttr(w) + '"\n' +
            '  height="' + escAttr(h) + '"\n' +
            '  frameborder="0"\n' +
            '  allow="autoplay; fullscreen; picture-in-picture"\n' +
            '  allowfullscreen\n' +
            '  loading="lazy">\n' +
            '</iframe>';

        if (src) {
            embedPreview.href = src;
            embedPreview.style.display = '';
        } else {
            embedPreview.style.display = 'none';
        }
    }

    function openModal() {
        buildCode();
        embedModal.classList.add('active');
    }
    function closeModal() {
        embedModal.classList.remove('active');
    }

    embedBtn.addEventListener('click', openModal);
    embedClose.addEventListener('click', closeModal);
    embedModal.addEventListener('click', function (e) {
        if (e.target === embedModal) closeModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });

    embedWidth.addEventListener('input', buildCode);
    embedHeight.addEventListener('input', buildCode);

    embedCopy.addEventListener('click', function () {
        const text = embedCode.value;
        const done = function () {
            embedCopy.textContent = 'Copied!';
            embedCopy.classList.add('copied');
            embedHint.textContent = 'Paste into your site\'s HTML.';
            setTimeout(function () {
                embedCopy.textContent = 'Copy code';
                embedCopy.classList.remove('copied');
            }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () {
                fallbackCopy(text);
                done();
            });
        } else {
            fallbackCopy(text);
            done();
        }
    });

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }
})();
</script>
