<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fox Cricket Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#wrap{width:100%;height:100%;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.plyr{width:100%;height:100%;--plyr-color-main:#fff}
.plyr__controls{justify-content:flex-end!important}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted autoplay></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<script>
const video = document.getElementById('video');
const source = 'https://edg12.smytdryt.live/eb811ab698f20153e91e33ee87c2b689/multy.m3u8?match_id=46093236&s_id=24&t_id=511355&stats=stats1wcxpt.life&timestamp=1794146709&language=eng&key=VTJGc2RHVmtYMS9vVm1sek5GUjZLN2JXMjB6YzBmVnFDMzAya1c4d1I5NUwyc1pvak5pWnVCdHRTM1RkeGN1QWRINWUvaWE4em9JSWFqN2E1NUtNZ2k3aTdXVlJpRng4dnk4RDJWc1VmRFhYaU5NUjN3WksyS3F0RVRPaXFiRnMvMTkxd3F2Q3dheGt4ZCtoUU1oSXMwN3ROUkE2TFFyNytIRFRoNUZ0WGtPc05lWVhPQVNWUVBGVmlRYWpRTHBZdFc4dkFxV1hpMWN4dkxnTXJjdDBPcjN4blE5RmN3VEtMdy9MMkxhTkZMVT0%3D&excluded_languages=';

const player = new Plyr(video, {
  autoplay: true,
  muted: true,
  controls: ['fullscreen'],
  settings: [],
  clickToPlay: false,
  hideControls: true,
  tooltips: { controls: false, seek: false }
});

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(source);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (data.fatal) {
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    }
  });
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = source;
  video.addEventListener('loadedmetadata', () => video.play().catch(() => {}));
} else {
  document.body.innerHTML = '<p style="color:white">This browser does not support HLS playback.</p>';
}
</script>
</body>
</html>
