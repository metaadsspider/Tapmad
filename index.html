
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox Cricket</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

#fullscreen {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  background: rgba(0,0,0,.65);
  color: white;
  border: 0;
  padding: 10px;
  font-size: 22px;
  cursor: pointer;
  border-radius: 6px;
}
</style>
</head>

<body>
<div id="container">
  <iframe
    src="https://video-translations.top-parser.com/sm/iframe?ref=aHR0cHM6Ly9zbWQuc3BvcnRwbGF5ZXIuaW8vZW1iZWQucGhwLz9tYXRjaF9pZD00NjA5MzIzNiZzaz1hNWUwMDEzJnR5cGU9cw&t=1794145500&lang=en&ts=1794146662&sign=8708978188907478e55a10ba05f7726b0cb379fd0eae3b523939cf31793f6c3c"
    allow="autoplay; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer">
  </iframe>

  <button id="fullscreen" title="Fullscreen">⛶</button>
</div>

<script>
document.getElementById("fullscreen").onclick = () => {
  const container = document.getElementById("container");

  if (!document.fullscreenElement) {
    container.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};
</script>
</body>
</html>
